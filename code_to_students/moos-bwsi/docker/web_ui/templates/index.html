<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BWSI AUVC — Mission Dashboard</title>

  <!-- Leaflet.js for the map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: monospace; background: #111; color: #eee; display: flex;
           flex-direction: column; height: 100vh; }

    header { background: #1a1a2e; padding: 10px 16px; display: flex;
             align-items: center; gap: 16px; border-bottom: 1px solid #333; }
    header h1 { font-size: 1.1rem; color: #7fc8f8; }
    #status-badge { padding: 3px 10px; border-radius: 4px; font-size: 0.8rem; }
    .badge-deployed { background: #1a7a2e; color: #7fffaa; }
    .badge-idle     { background: #3a1a1a; color: #ff8080; }

    #score-bar { background: #16213e; padding: 6px 16px; font-size: 0.78rem;
                 color: #a8d8ea; border-bottom: 1px solid #333; min-height: 28px; }

    main { display: flex; flex: 1; overflow: hidden; }

    #map { flex: 3; background: #0d1117; }

    #sidebar { flex: 1; min-width: 220px; max-width: 280px; background: #16213e;
               overflow-y: auto; padding: 10px; border-left: 1px solid #333; }
    #sidebar h2 { font-size: 0.85rem; color: #7fc8f8; margin-bottom: 8px; }
    .v-card { background: #1a2a3e; border-radius: 6px; padding: 8px;
              margin-bottom: 8px; border-left: 3px solid #7fc8f8; }
    .v-card.npc { border-left-color: #ff8c00; }
    .v-card.stale { opacity: 0.45; }
    .v-name { font-weight: bold; font-size: 0.9rem; color: #e0f0ff; }
    .v-meta { font-size: 0.72rem; color: #99aacc; margin-top: 2px; }

    #ctrl-bar { background: #1a1a2e; padding: 8px 16px; display: flex; gap: 10px;
                border-top: 1px solid #333; }
    button { padding: 6px 18px; border: none; border-radius: 4px; cursor: pointer;
             font-family: monospace; font-size: 0.85rem; }
    #btn-deploy { background: #1a7a2e; color: #7fffaa; }
    #btn-halt   { background: #7a1a1a; color: #ffaaaa; }
    #btn-deploy:hover { background: #22aa44; }
    #btn-halt:hover   { background: #aa2222; }
    #last-update { margin-left: auto; font-size: 0.72rem; color: #556; align-self: center; }
  </style>
</head>
<body>

<header>
  <h1>BWSI AUVC — Mission Dashboard</h1>
  <span id="status-badge" class="badge-idle">IDLE</span>
  <span style="font-size:0.75rem; color:#556;">
    shoreside: {{ shore_host }}:{{ shore_port }}
  </span>
</header>

<div id="score-bar">No score data yet.</div>

<main>
  <div id="map"></div>

  <div id="sidebar">
    <h2>Vehicles</h2>
    <div id="v-list">Waiting for NODE_REPORT...</div>
  </div>
</main>

<div id="ctrl-bar">
  <button id="btn-deploy" onclick="sendCmd('/api/deploy')">DEPLOY</button>
  <button id="btn-halt"   onclick="sendCmd('/api/halt')">HALT</button>
  <span id="last-update"></span>
</div>

<script>
// ---------------------------------------------------------------------------
// Leaflet map — MOOS local XY is a flat Cartesian grid.
// We use a simple CRS.Simple projection: x=east, y=north.
// ---------------------------------------------------------------------------
const map = L.map('map', {
  crs: L.CRS.Simple,
  center: [0, 0],
  zoom: 1,
  zoomSnap: 0.25,
});

// LatLng in CRS.Simple is actually [y, x]
function moosToLatLng(x, y) { return [y, x]; }

const vehicleMarkers = {};   // name → {marker, arrow}

function vehicleColor(group) {
  if (group === 'npc') return '#ff8c00';
  const palette = ['#7fc8f8','#7fffaa','#ffaaff','#fffaaa','#aaffff'];
  let h = 0;
  for (let i = 0; i < group.length; i++) h = (h * 31 + group.charCodeAt(i)) & 0xffff;
  return palette[h % palette.length];
}

function headingToArrow(hdg) {
  // SVG arrow pointing in heading direction (0=north, CW)
  const rad = (hdg - 90) * Math.PI / 180;
  const len = 18;
  const ex = 12 + Math.cos(rad) * len;
  const ey = 12 - Math.sin(rad) * len;
  return `<svg width="24" height="24">
    <circle cx="12" cy="12" r="5" fill="COLOR" stroke="#000" stroke-width="1"/>
    <line x1="12" y1="12" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}"
          stroke="COLOR" stroke-width="2" marker-end="url(#ah)"/>
  </svg>`.replace(/COLOR/g, 'CLRPH');
}

function updateMarker(name, v) {
  const ll   = moosToLatLng(v.x, v.y);
  const col  = vehicleColor(v.group);
  const stale = v.age_s > 10;

  if (!vehicleMarkers[name]) {
    const icon = L.divIcon({
      html: `<div style="
        width:12px;height:12px;border-radius:50%;
        background:${col};border:2px solid #000;
        opacity:${stale?0.4:1};
        transform:rotate(${v.heading}deg);"></div>`,
      iconSize: [12, 12], iconAnchor: [6, 6],
    });
    const marker = L.marker(ll, { icon }).addTo(map);
    marker.bindTooltip(name, { permanent: false, direction: 'top' });
    vehicleMarkers[name] = marker;
  } else {
    vehicleMarkers[name].setLatLng(ll);
    vehicleMarkers[name]._icon.style.opacity = stale ? 0.4 : 1;
    vehicleMarkers[name]._icon.style.transform =
      `rotate(${v.heading}deg)`;
  }
}

// ---------------------------------------------------------------------------
// Sidebar
// ---------------------------------------------------------------------------
function updateSidebar(vehicles) {
  const list = document.getElementById('v-list');
  if (!Object.keys(vehicles).length) {
    list.innerHTML = 'No contacts yet.';
    return;
  }
  list.innerHTML = Object.entries(vehicles)
    .sort(([a],[b]) => a.localeCompare(b))
    .map(([name, v]) => `
      <div class="v-card${v.group==='npc'?' npc':''}${v.age_s>10?' stale':''}">
        <div class="v-name">${name}</div>
        <div class="v-meta">
          ${v.group} / ${v.type}<br>
          x=${v.x.toFixed(1)} y=${v.y.toFixed(1)} dep=${v.depth.toFixed(1)}<br>
          hdg=${v.heading.toFixed(0)}° spd=${v.speed.toFixed(1)} m/s<br>
          age ${v.age_s}s
        </div>
      </div>`).join('');
}

// ---------------------------------------------------------------------------
// Poll /api/state every second
// ---------------------------------------------------------------------------
function poll() {
  fetch('/api/state')
    .then(r => r.json())
    .then(data => {
      // Deploy badge
      const badge = document.getElementById('status-badge');
      badge.textContent  = data.deployed ? 'DEPLOYED' : 'IDLE';
      badge.className    = 'badge-' + (data.deployed ? 'deployed' : 'idle');

      // Score bar
      if (data.score) {
        document.getElementById('score-bar').textContent = data.score;
      }

      // Map + sidebar
      for (const [name, v] of Object.entries(data.vehicles)) {
        updateMarker(name, v);
      }
      updateSidebar(data.vehicles);

      // Fit map bounds once we have vehicles
      if (Object.keys(data.vehicles).length && !map._fittedOnce) {
        const pts = Object.values(data.vehicles).map(v => moosToLatLng(v.x, v.y));
        map.fitBounds(L.latLngBounds(pts).pad(0.3));
        map._fittedOnce = true;
      }

      document.getElementById('last-update').textContent =
        'updated ' + new Date().toLocaleTimeString();
    })
    .catch(err => {
      document.getElementById('last-update').textContent =
        'poll error: ' + err.message;
    });
}

setInterval(poll, 1000);
poll();

// ---------------------------------------------------------------------------
// Control buttons
// ---------------------------------------------------------------------------
function sendCmd(endpoint) {
  fetch(endpoint, { method: 'POST' })
    .then(r => r.json())
    .then(d => { if (!d.ok) alert('Error: ' + d.reason); })
    .catch(err => alert('Request failed: ' + err.message));
}
</script>
</body>
</html>
